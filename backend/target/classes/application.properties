server.port=8080
spring.application.name=FraudShield-AI

# Dual-Mode Database Configuration
# Defaults to embedded H2 for instant demo & viva execution without prior database install.
# Easily switches to MySQL by passing -Dspring.profiles.active=mysql or setting environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:fraudshield;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# H2 Console (available at /h2-console for live table verification during viva)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration (Set JWT_SECRET environment variable in production)
jwt.secret=${JWT_SECRET:FraudShieldSuperSecureSecretKeyLongerThan256BitsForHMACSHA256Security}
jwt.expiration-ms=86400000

# AI Explanation Configuration (Google Gemini API)
# Store your Google Gemini API key in the GEMINI_API_KEY environment variable.
# If absent or rate-limited, the system seamlessly uses its intelligent local heuristic fallback.
gemini.api-key=${GEMINI_API_KEY:}

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/
